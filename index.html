<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA Настройки и Иконки -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152-v7.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167-v7.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180-v7.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png?v=20260920-favicon-v3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=20260920-favicon-v3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png?v=20260920-favicon-v3" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DAYRIS" />
    <meta name="application-name" content="DAYRIS" />
    <meta property="og:title" content="DAYRIS" />
    <meta property="og:site_name" content="DAYRIS" />
    <meta name="twitter:title" content="DAYRIS" />

    <style>
      html, body { margin: 0; background: #09090b; }
      #boot-screen { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; transition: opacity 240ms ease; }
      #boot-screen .boot-mark { width: 112px; height: 112px; padding: 17px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; border-radius: 29px; border: 1px solid #49605d; background: radial-gradient(ellipse at top right, #075c47, transparent 65%), linear-gradient(135deg, #43515c, #12191d 45%, #173c34); box-shadow: inset 1px 1px 3px #c0d5df88, inset -1px -1px 3px #10b98199, 0 16px 40px #0005; perspective: 400px; animation: boot-housing 700ms cubic-bezier(.22,1,.36,1) both; }
      #boot-screen .boot-tile { border-radius: 11px; border: 1px solid #819c9c; background: linear-gradient(145deg, #7b919b, #263239 30%, #10171b 75%, #27554a); box-shadow: inset 1px 1px 3px #e2f0f4aa, inset -1px -1px 3px #34d39955, 0 2px 4px #0009; animation: boot-tile-enter 850ms cubic-bezier(.22,1,.36,1) both; animation-delay: var(--delay); }
      #boot-screen .boot-tile:nth-child(1) { --delay: 80ms; }
      #boot-screen .boot-tile:nth-child(2) { --delay: 180ms; border-color: #6fffd1; background: linear-gradient(145deg, #c3ffea, #13dc9a 30%, #048c62 75%, #41ffc0); box-shadow: inset 1px 1px 4px #edfff4, inset -1px -1px 4px #5affcb, 0 0 14px #10d99a66; }
      #boot-screen .boot-tile:nth-child(3) { --delay: 380ms; }
      #boot-screen .boot-tile:nth-child(4) { --delay: 280ms; }
      #boot-screen .boot-tile::after { content: ''; display: block; width: 100%; height: 100%; border-radius: inherit; background: #6fffd1; animation: boot-tile-glow 2.8s ease-in-out infinite; animation-delay: calc(900ms + var(--delay)); opacity: 0; }
      #boot-screen .boot-name { margin: 20px 0 24px; font-size: 19px; font-weight: 600; letter-spacing: .22em; padding-left: .22em; }
      #boot-screen .boot-track { width: 72px; height: 2px; overflow: hidden; border-radius: 2px; background: #27272a; }
      #boot-screen .boot-track::after { content: ''; display: block; width: 32px; height: 100%; background: #34d399; animation: boot-progress 1.2s ease-in-out infinite; }
      #boot-screen[data-ready] { opacity: 0; pointer-events: none; }
      #boot-connection { max-width: 290px; padding: 0 24px; text-align: center; }
      #boot-connection[hidden] { display: none; }
      #boot-connection svg { width: 22px; height: 22px; margin: 22px auto 10px; color: #e6ba72; }
      #boot-message { margin: 0; font-size: 15px; font-weight: 600; }
      #boot-detail { color: #a1a1aa; font-size: 12px; line-height: 1.6; margin: 8px 0 18px; }
      #boot-action { padding: 12px 22px; min-height: 46px; border: 1px solid #3c5c50; border-radius: 14px; background: linear-gradient(135deg,#173d31,#14251f); color: #d8f6e8; font: inherit; font-size: 14px; cursor: pointer; }
      #boot-action:disabled { opacity: .5; cursor: default; }
      html[data-booting] #root { visibility: hidden; }
      @keyframes boot-progress { 0% { transform: translateX(-32px); } 100% { transform: translateX(72px); } }
      @keyframes boot-housing { from { opacity: 0; transform: translateY(12px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes boot-tile-enter { from { opacity: 0; transform: translateY(14px) rotateY(-65deg) rotateZ(-12deg) scale(.65); } to { opacity: 1; transform: translateY(0) rotateY(0) rotateZ(0) scale(1); } }
      @keyframes boot-tile-glow { 0%, 55%, 100% { opacity: 0; } 22% { opacity: .2; } }
      @media (prefers-reduced-motion: reduce) { #boot-screen { transition: none; } #boot-screen .boot-mark, #boot-screen .boot-tile, #boot-screen .boot-tile::after { animation: none; } #boot-screen .boot-track::after { animation: none; width: 100%; } }
    </style>
    <script>document.documentElement.setAttribute('data-booting', '');</script>
    <title>DAYRIS — Денежный календарь</title>
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div id="boot-screen" role="status" aria-label="DAYRIS загружается">
      <div class="boot-mark" aria-hidden="true"><span class="boot-tile"></span><span class="boot-tile"></span><span class="boot-tile"></span><span class="boot-tile"></span></div>
      <div class="boot-name">DAYRIS</div>
      <div class="boot-track" aria-hidden="true"></div>
      <div id="boot-connection" hidden aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m3 3 18 18M8.5 8.5A13 13 0 0 1 21 8M3 8a13 13 0 0 1 2-1.4M6 12a9 9 0 0 1 3-1.7M12.5 10a9 9 0 0 1 5.5 2M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".7"/></svg>
        <p id="boot-message"></p><p id="boot-detail"></p><button id="boot-action" type="button"></button>
      </div>
    </div>
    <script>
      (function () {
        var ready = false, stalled = false, accepted = false;
        var splash = document.getElementById('boot-screen');
        var panel = document.getElementById('boot-connection');
        var message = document.getElementById('boot-message');
        var detail = document.getElementById('boot-detail');
        var action = document.getElementById('boot-action');
        var language = 'ru';
        try { language = localStorage.getItem('atj_language') || navigator.language || 'ru'; } catch (_) {}
        document.documentElement.lang = /^zh/i.test(language) ? 'zh-CN' : /^(ro|md)/.test(language) ? 'ro' : /^en/.test(language) ? 'en' : 'ru';
        splash.setAttribute('aria-label', /^zh/i.test(language) ? 'DAYRIS 正在加载' : /^en/.test(language) ? 'DAYRIS is loading' : /^(ro|md)/.test(language) ? 'DAYRIS se încarcă' : 'DAYRIS загружается');
        var copy = /^zh/i.test(language)
          ? ['当前离线', '可以使用此设备上保存的日历。', '离线继续', '正在准备已保存的日历…', '请先联网打开一次 DAYRIS，以准备离线访问。', '重试加载', '加载时间较长', '请检查网络后重试。']
          : /^en/.test(language)
          ? ['You are offline', 'Your saved calendar is available on this device.', 'Continue offline', 'Preparing your saved calendar…', 'Open DAYRIS online once to prepare offline access.', 'Retry loading', 'Loading is taking longer', 'Check your connection and try again.']
          : /^(ro|md)/.test(language)
          ? ['Sunteți offline', 'Calendarul salvat este disponibil pe acest dispozitiv.', 'Continuă offline', 'Se pregătește calendarul salvat…', 'Deschideți DAYRIS online o dată pentru acces offline.', 'Reîncearcă', 'Încărcarea durează mai mult', 'Verificați conexiunea și încercați din nou.']
          : ['Нет подключения к интернету', 'Сохранённый календарь доступен на этом устройстве.', 'Перейти в офлайн', 'Подготавливаем сохранённый календарь…', 'Для подготовки офлайн-доступа откройте DAYRIS с интернетом.', 'Повторить загрузку', 'Загрузка занимает больше времени', 'Проверьте подключение и попробуйте ещё раз.'];
        function reveal() {
          if (!ready || splash.hasAttribute('data-ready')) return;
          document.documentElement.removeAttribute('data-booting');
          splash.setAttribute('data-ready', '');
          window.setTimeout(function () { splash.remove(); }, 260);
          window.removeEventListener('offline', update);
          window.removeEventListener('online', update);
        }
        function update() {
          if (splash.hasAttribute('data-ready')) return;
          if (ready && (navigator.onLine || accepted)) { reveal(); return; }
          var offline = !navigator.onLine;
          panel.hidden = !offline && !stalled;
          if (panel.hidden) return;
          message.textContent = copy[offline ? 0 : 6];
          detail.textContent = copy[offline ? (ready ? 1 : stalled ? 4 : 3) : 7];
          action.textContent = copy[offline && (ready || !stalled) ? 2 : 5];
          action.disabled = offline && !ready && !stalled;
          action.onclick = function () {
            if (offline && ready) { accepted = true; reveal(); }
            else window.location.reload();
          };
        }
        window.dayrisBoot = { ready: function () { ready = true; update(); } };
        window.addEventListener('offline', update);
        window.addEventListener('online', update);
        window.setTimeout(function () { stalled = true; update(); }, 15000);
        update();
      })();
    </script>
    <noscript><style>#boot-screen { display: none; }</style><p style="color:#f4f4f5;text-align:center;padding:24px">Для запуска DAYRIS включите JavaScript.</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
