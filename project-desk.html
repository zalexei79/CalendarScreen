<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="robots" content="noindex,nofollow"/><title>DAYRIS · Локальная мастерская</title></head><body style="margin:0;background:#101319;color:#e7ebf3;font:16px/1.6 system-ui,sans-serif"><div id="root"><main style="max-width:720px;margin:48px auto;padding:24px"><h1>DAYRIS · Студия</h1><p id="studio-startup-status" role="status">Загружаем локальную мастерскую…</p><p>Если окно не загружается, запустите в папке проекта:</p><pre>npm run project:desk</pre><p>Оставьте терминал открытым и обновите эту страницу. Обычный сервер готовой сборки не запускает студию.</p></main></div><script>
(()=>{const fail=()=>{let node=document.getElementById('studio-startup-status');if(!node){node=document.createElement('p');node.style.padding='24px';document.getElementById('root').append(node);}node.textContent='Не удалось загрузить студию. Проверьте запуск npm run project:desk в папке проекта и обновите страницу.';};window.addEventListener('error',fail,true);window.addEventListener('dayris:studio-mounted',()=>window.removeEventListener('error',fail,true),{once:true});})();
</script><script type="module" src="/src/projectDesk.jsx"></script></body></html>
