<!doctype html>
<html lang="ru">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAYRIS — проверка иконок</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #09090b; color: #fafafa; font: 15px system-ui, sans-serif; }
  main { max-width: 880px; margin: auto; }
  h1 { font-size: 24px; } h2 { margin-top: 0; font-size: 17px; }
  section { margin: 16px 0; padding: 24px; border: 1px solid #34343a; border-radius: 24px; }
  .light { background: #fafafa; color: #18181b; }
  .row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; } figcaption { margin-top: 12px; font-size: 12px; opacity: .7; }
  .mark { border-radius: 22%; object-fit: contain; }
  .round { border-radius: 50%; }
  .squircle { border-radius: 24%; }
  canvas { width: 120px; height: 120px; }
  #status { color: #34d399; }
</style>
<main>
  <h1>DAYRIS — новая иконка</h1>
  <section><h2>В приложении · тёмная тема</h2><div class="row" data-sizes></div></section>
  <section class="light"><h2>В приложении · светлая тема</h2><div class="row" data-sizes></div></section>
  <section><h2>Иконки устройства</h2><div class="row">
    <figure><img class="round" src="/icon-maskable-192.png?v=20260920-polished" width="120" height="120" alt="Android circle"><figcaption>Android · круг</figcaption></figure>
    <figure><img class="squircle" src="/icon-maskable-192.png?v=20260920-polished" width="120" height="120" alt="Android rounded square"><figcaption>Android · квадрат</figcaption></figure>
    <figure><img class="squircle" src="/icon-180.png?v=20260920-polished" width="120" height="120" alt="iPhone"><figcaption>iPhone</figcaption></figure>
    <figure><img src="/icon-512.png?v=20260920-polished" width="120" height="120" alt="Store"><figcaption>Магазин · 512×512</figcaption></figure>
  </div></section>
  <section><h2>Экспорт карточек «Поделиться»</h2><div class="row"><canvas id="dark" width="240" height="240"></canvas><canvas id="light" width="240" height="240"></canvas></div><p id="status">Проверка экспорта…</p></section>
</main>
<script type="module">
  import { APP_ICON } from '/src/shared/config/brand.js';
  import { loadBrandIcon, drawBrandIcon } from '/src/shared/lib/brandIcon.js';
  for (const row of document.querySelectorAll('[data-sizes]')) {
    for (const size of [16, 32, 36, 40, 64]) {
      const figure = document.createElement('figure');
      const image = new Image(size, size);
      image.src = size === 16 ? '/icon-16.png?v=20260920-polished' : APP_ICON;
      image.className = 'mark';
      image.alt = `${size}px`;
      const caption = document.createElement('figcaption');
      caption.textContent = `${size}px`;
      figure.append(image, caption);
      row.append(figure);
    }
  }
  try {
    const icon = await loadBrandIcon();
    for (const [id, background] of [['dark', '#09090b'], ['light', '#fafafa']]) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, 240, 240);
      drawBrandIcon(ctx, icon, 28, 28, 184);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob?.size) throw new Error('Empty PNG export');
    }
    document.getElementById('status').textContent = 'PNG-экспорт обеих тем: OK';
  } catch (error) {
    document.getElementById('status').textContent = `Ошибка: ${error.message}`;
  }
</script>
</html>
